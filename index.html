<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Apartment Designer</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="app">

  <!-- ── Toolbar ── -->
  <header id="toolbar">
    <div class="tb-left">

      <!-- Mode -->
      <div class="mode-btns">
        <button id="btn-mode-2d" class="active" title="2D floor plan">2D Plan</button>
        <button id="btn-mode-3d" title="3D walkthrough">3D View</button>
      </div>

      <!-- Draw tools -->
      <div class="tb-group" id="tools-2d">
        <button class="tb-btn active" id="btn-room"   title="Draw Room — drag to create (R)">⬜</button>
        <button class="tb-btn"        id="btn-wall"   title="Draw Wall — click-click (W)">▭</button>
        <button class="tb-btn"        id="btn-select" title="Select &amp; Move (V)">↖</button>
        <button class="tb-btn"        id="btn-eraser" title="Erase (E)">✕</button>
      </div>

      <div class="tb-sep"></div>

      <!-- Undo/Redo -->
      <div class="tb-group">
        <button class="tb-btn" id="btn-undo" title="Undo (Ctrl+Z)" disabled>↩</button>
        <button class="tb-btn" id="btn-redo" title="Redo (Ctrl+Y)" disabled>↪</button>
      </div>

      <div class="tb-sep"></div>

      <!-- File ops -->
      <div class="tb-group">
        <button class="tb-btn" id="btn-save"   title="Download layout">💾</button>
        <button class="tb-btn" id="btn-load"   title="Load layout">📂</button>
        <button class="tb-btn" id="btn-clear"  title="Clear all">🗑</button>
        <button class="tb-btn" id="btn-export" title="Save as PNG">📷</button>
        <button class="tb-btn" id="btn-sound"  title="Toggle sound">🔊</button>
      </div>
    </div>

    <h1>Apartment Designer</h1>
  </header>

  <!-- ── Main ── -->
  <div id="main">

    <!-- Furniture shop sidebar -->
    <aside id="sidebar">
      <div id="sb-toggle-row">
        <button id="btn-sidebar-toggle" title="Toggle furniture panel">☰</button>
      </div>
      <div class="pal-search">
        <input type="text" id="palette-search" placeholder="Search furniture…">
      </div>
      <div id="furniture-palette"></div>
    </aside>

    <!-- Canvas / 3D view -->
    <div id="canvas-container">
      <canvas id="canvas-2d"></canvas>
      <div id="view-3d"></div>

      <!-- Budget HUD (2D only) -->
      <div id="budget-hud">
        <div class="budget-row">
          <span class="budget-label">Budget</span>
          <span class="budget-nums">
            <span id="budget-spent">$0</span>
            <span class="budget-sep">/</span>
            <span class="budget-total">$10,000</span>
          </span>
        </div>
        <div class="budget-track"><div id="budget-fill"></div></div>
        <div id="budget-remaining">$10,000 left</div>
      </div>
    </div>

  </div>

  <!-- ── Status bar ── -->
  <footer id="statusbar">
    <span id="status-text">Draw Room: drag on the canvas to create a room</span>
    <span id="zoom-label">20 px/ft</span>
  </footer>

</div>

<!-- Toast container -->
<div id="toast-wrap"></div>

<!-- Hidden file input -->
<input type="file" id="file-input" accept=".json" style="display:none">

<script type="module" src="app.js"></script>
</body>
</html>
